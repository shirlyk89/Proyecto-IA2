<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B6478" />
    </marker>
  </defs>

  <rect width="1000" height="460" fill="#F5F6F9" />

  <!-- n8n -->
  <rect x="40" y="180" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1.5" />
  <text x="115" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#12172B">n8n</text>
  <text x="115" y="228" text-anchor="middle" font-size="11" fill="#5B6478">Schedule 6:00 AM</text>
  <text x="115" y="242" text-anchor="middle" font-size="11" fill="#5B6478">America/Bogota</text>

  <!-- MCP Server -->
  <rect x="260" y="180" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1.5" />
  <text x="335" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#12172B">MCP Server</text>
  <text x="335" y="228" text-anchor="middle" font-size="11" fill="#5B6478">6 herramientas</text>
  <text x="335" y="242" text-anchor="middle" font-size="11" fill="#5B6478">HTTP/SSE</text>

  <!-- API Spring Boot -->
  <rect x="480" y="180" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#2954E5" stroke-width="2" />
  <text x="560" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#12172B">API Spring Boot</text>
  <text x="560" y="226" text-anchor="middle" font-size="11" fill="#5B6478">JWT · rol AGENTE</text>
  <text x="560" y="240" text-anchor="middle" font-size="11" fill="#5B6478">reglas de negocio</text>

  <!-- PostgreSQL -->
  <rect x="480" y="330" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1.5" />
  <text x="560" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#12172B">PostgreSQL</text>
  <text x="560" y="378" text-anchor="middle" font-size="11" fill="#5B6478">Supabase</text>
  <text x="560" y="392" text-anchor="middle" font-size="11" fill="#5B6478">única fuente de verdad</text>

