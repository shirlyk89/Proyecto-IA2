  <text x="830" y="226" text-anchor="middle" font-size="11" fill="#5B6478">HTML / CSS / JS</text>
  <text x="830" y="240" text-anchor="middle" font-size="11" fill="#5B6478">login JWT + PDF</text>

  <!-- Administrador -->
  <rect x="760" y="330" width="140" height="70" rx="10" fill="#EAF0FE" stroke="#2954E5" stroke-width="1.5" />
  <text x="830" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#2954E5">Administrador</text>
  <text x="830" y="378" text-anchor="middle" font-size="11" fill="#2954E5">aprueba / recibe</text>

  <!-- Arrows -->
  <line x1="190" y1="220" x2="256" y2="220" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="410" y1="220" x2="476" y2="220" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="560" y1="260" x2="560" y2="326" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="640" y1="220" x2="736" y2="220" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="830" y1="260" x2="830" y2="326" stroke="#2954E5" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="115" y="150" text-anchor="middle" font-size="11" fill="#5B6478" font-style="italic">1. Dispara el flujo diario</text>
  <text x="335" y="150" text-anchor="middle" font-size="11" fill="#5B6478" font-style="italic">2. AI Agent + Skill llama tools</text>
  <text x="555" y="150" text-anchor="middle" font-size="11" fill="#5B6478" font-style="italic">3. REST + JWT rol AGENTE</text>
  <text x="785" y="150" text-anchor="middle" font-size="11" fill="#5B6478" font-style="italic">4. KPIs, riesgo, órdenes, PDF</text>
  <text x="700" y="410" text-anchor="middle" font-size="11" fill="#2954E5" font-style="italic">5. Aprueba / recibe (solo ADMIN)</text>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#12172B">LogiTrack IQ — Flujo de datos</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#5B6478">n8n → MCP → API Spring Boot → PostgreSQL → Dashboard</text>
</svg>
